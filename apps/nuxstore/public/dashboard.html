<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>NuxFashion Live</title>
<style>
  :root {
    --bg: #0f0f13;
    --card: #1a1a24;
    --card2: #22222f;
    --border: #2e2e40;
    --gold: #f59e0b;
    --gold2: #fbbf24;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #a855f7;
    --text: #f1f5f9;
    --muted: #64748b;
    --accent: #6366f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* Header */
  .header { background: linear-gradient(135deg, #1a1a24 0%, #0f0f13 100%); padding: 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 99; }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 18px; font-weight: 900; background: linear-gradient(135deg, var(--gold), var(--gold2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .live-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--green); font-weight: 700; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
  .header-sub { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .date-str { font-size: 12px; color: var(--muted); }
  .refresh-btn { background: var(--card2); border: 1px solid var(--border); color: var(--text); font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
  .refresh-btn:active { opacity: .7; }

  /* Config Bar */
  .config-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .config-bar input { background: var(--card2); border: 1px solid var(--border); color: var(--text); font-size: 12px; padding: 6px 10px; border-radius: 8px; flex: 1; min-width: 180px; outline: none; }
  .config-bar input::placeholder { color: var(--muted); }
  .save-btn { background: var(--gold); color: #000; font-size: 12px; font-weight: 900; padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer; white-space: nowrap; }
  .config-note { font-size: 10px; color: var(--muted); width: 100%; }

  /* Scroll container */
  .content { padding: 16px; display: flex; flex-direction: column; gap: 16px; max-width: 600px; margin: 0 auto; }

  /* Section title */
  .sec-title { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .sec-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* KPI Grid */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
  .kpi-card.gold { border-color: #f59e0b44; background: linear-gradient(135deg, #1a1a24, #1f1a0f); }
  .kpi-card.green { border-color: #22c55e33; background: linear-gradient(135deg, #1a1a24, #0f1f14); }
  .kpi-card.blue { border-color: #3b82f633; background: linear-gradient(135deg, #1a1a24, #0f141f); }
  .kpi-card.purple { border-color: #a855f733; background: linear-gradient(135deg, #1a1a24, #17101f); }
  .kpi-icon { font-size: 20px; margin-bottom: 6px; }
  .kpi-val { font-size: 22px; font-weight: 900; line-height: 1; }
  .kpi-val.gold { color: var(--gold); }
  .kpi-val.green { color: var(--green); }
  .kpi-val.blue { color: var(--blue); }
  .kpi-val.purple { color: var(--purple); }
  .kpi-label { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 600; }
  .kpi-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* Wide card */
  .wide-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }

  /* Revenue bar */
  .rev-bar-wrap { margin-top: 10px; }
  .rev-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .rev-bar-bg { background: var(--card2); border-radius: 99px; height: 8px; overflow: hidden; }
  .rev-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width .8s ease; }

  /* Alert list */
  .alert-list { display: flex; flex-direction: column; gap: 8px; }
  .alert-item { display: flex; align-items: center; gap: 10px; background: var(--card2); border-radius: 12px; padding: 10px 12px; }
  .alert-icon { font-size: 18px; flex-shrink: 0; }
  .alert-text { flex: 1; }
  .alert-title { font-size: 13px; font-weight: 700; }
  .alert-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .alert-badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; }
  .badge-red { background: #ef444422; color: var(--red); }
  .badge-amber { background: #f59e0b22; color: var(--gold); }
  .badge-blue { background: #3b82f622; color: var(--blue); }

  /* Table */
  .table-wrap { overflow-x: auto; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { color: var(--muted); font-weight: 700; text-align: left; padding: 6px 8px; font-size: 10px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  td { padding: 9px 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .rank { color: var(--gold); font-weight: 900; font-size: 13px; }
  .sar { color: var(--gold2); font-weight: 700; }
  .tag-green { color: var(--green); font-weight: 700; font-size: 11px; }
  .tag-red { color: var(--red); font-weight: 700; font-size: 11px; }

  /* Staff card */
  .staff-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .staff-row { display: flex; align-items: center; gap: 10px; }
  .staff-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: var(--gold); border: 1px solid var(--border); flex-shrink: 0; }
  .staff-info { flex: 1; }
  .staff-name { font-size: 13px; font-weight: 700; }
  .staff-orders { font-size: 11px; color: var(--muted); }
  .staff-rev { font-size: 13px; font-weight: 900; color: var(--gold2); }
  .staff-bar-bg { height: 4px; background: var(--card2); border-radius: 99px; margin-top: 4px; }
  .staff-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold2)); }

  /* Loading */
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 12px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--muted); }

  /* Error */
  .error-box { background: #ef444411; border: 1px solid #ef444433; border-radius: 16px; padding: 20px; text-align: center; }
  .error-box h3 { color: var(--red); font-size: 15px; margin-bottom: 6px; }
  .error-box p { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .error-box .api-url-hint { margin-top: 10px; font-size: 11px; background: var(--card2); padding: 8px; border-radius: 8px; color: var(--text); word-break: break-all; }

  /* Empty */
  .empty { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; }

  /* Last updated */
  .last-updated { text-align: center; font-size: 10px; color: var(--muted); padding: 8px; }

  /* Token input */
  .config-bar input[type="password"] { font-family: monospace; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">⚡ NuxFashion Live</div>
    <div class="live-badge"><div class="dot"></div> LIVE</div>
  </div>
  <div class="header-sub">
    <div class="date-str" id="dateStr">Loading...</div>
    <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
  </div>
</div>

<div class="config-bar" id="configBar">
  <input type="text" id="apiUrl" placeholder="API URL e.g. https://yourapp.railway.app" autocomplete="off"/>
  <input type="password" id="apiToken" placeholder="JWT Token (from ERP login)" autocomplete="off"/>
  <button class="save-btn" onclick="saveConfig()">Save & Load</button>
  <div class="config-note">💡 Token: Login to ERP → browser DevTools → Network → any request → copy Authorization header value (without "Bearer ")</div>
</div>

<div class="content" id="mainContent">
  <div class="loading" id="initialMsg">
    <div style="font-size:32px">📊</div>
    <div class="loading-text">Enter your API URL and token above to load live data</div>
  </div>
</div>

<div class="last-updated" id="lastUpdated"></div>

<script>
const API_KEY = 'nux_api_url';
const TOK_KEY = 'nux_token';

function saveConfig() {
  const url = document.getElementById('apiUrl').value.trim().replace(/\/$/, '');
  const tok = document.getElementById('apiToken').value.trim();
  if (!url) return alert('Please enter API URL');
  if (!tok) return alert('Please enter JWT Token');
  localStorage.setItem(API_KEY, url);
  localStorage.setItem(TOK_KEY, tok);
  loadAll();
}

function loadConfig() {
  const url = localStorage.getItem(API_KEY) || '';
  const tok = localStorage.getItem(TOK_KEY) || '';
  document.getElementById('apiUrl').value = url;
  document.getElementById('apiToken').value = tok;
  return { url, tok };
}

async function apiFetch(path) {
  const url = localStorage.getItem(API_KEY);
  const tok = localStorage.getItem(TOK_KEY);
  if (!url || !tok) throw new Error('NO_CONFIG');
  const res = await fetch(url + path, {
    headers: { 'Authorization': 'Bearer ' + tok }
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function fmtSAR(n) {
  const v = Number(n) || 0;
  if (v >= 1000000) return 'SAR ' + (v/1000000).toFixed(1) + 'M';
  if (v >= 1000) return 'SAR ' + (v/1000).toFixed(1) + 'k';
  return 'SAR ' + v.toFixed(0);
}
function fmtNum(n) { return (Number(n)||0).toLocaleString(); }

function todayDate() {
  return new Date().toLocaleDateString('en-SA', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}

function showLoading(id) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">Loading...</div></div>';
}

async function loadAll() {
  const { url, tok } = loadConfig();
  if (!url || !tok) {
    document.getElementById('mainContent').innerHTML = '<div class="loading" id="initialMsg"><div style="font-size:32px">📊</div><div class="loading-text">Enter your API URL and token above to load live data</div></div>';
    return;
  }

  document.getElementById('dateStr').textContent = todayDate();
  document.getElementById('mainContent').innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">Fetching live data...</div></div>';

  // Fetch all in parallel
  const today = new Date().toISOString().split('T')[0];
  const monthStart = today.slice(0,7) + '-01';

  let dash = null, salesPeriod = [], salesProduct = [], salesStaff = [];
  const errors = [];

  await Promise.allSettled([
    apiFetch('/reports/dashboard').then(d => dash = d).catch(e => errors.push('Dashboard: ' + e.message)),
    apiFetch(`/reports/sales/by-period?from=${monthStart}&to=${today}&group_by=day`).then(d => salesPeriod = Array.isArray(d) ? d : []).catch(() => {}),
    apiFetch(`/reports/sales/by-product?from=${today}&to=${today}&limit=5`).then(d => salesProduct = Array.isArray(d) ? d : []).catch(() => {}),
    apiFetch(`/reports/sales/by-staff?from=${today}&to=${today}`).then(d => salesStaff = Array.isArray(d) ? d : []).catch(() => {}),
  ]);

  if (errors.length && !dash) {
    document.getElementById('mainContent').innerHTML = `
      <div class="error-box">
        <h3>⚠️ Connection Failed</h3>
        <p>Could not connect to your API. Check the URL and token.</p>
        <div class="api-url-hint">API: ${localStorage.getItem(API_KEY)}</div>
        <p style="margin-top:8px;font-size:11px">${errors.join('<br>')}</p>
      </div>`;
    return;
  }

  // Parse dashboard
  const todayD = dash?.today || {};
  const monthD = dash?.this_month || {};
  const invD   = dash?.inventory || {};
  const custD  = dash?.customers || {};
  const alerts = dash?.alerts || {};

  const todayRev = Number(todayD.revenue || 0);
  const todayOrders = Number(todayD.orders || 0);
  const monthRev = Number(monthD.revenue || 0);
  const monthOrders = Number(monthD.orders || 0);
  const monthTarget = monthRev * 1.2; // mock target
  const pct = monthTarget > 0 ? Math.min((monthRev / monthTarget * 100), 100).toFixed(0) : 0;

  // Top product
  const top = salesProduct[0] || {};
  const topName = String(top.product || top.variant || '—').slice(0, 20);

  // Staff max for bar
  const staffMax = Math.max(...salesStaff.map(s => Number(s.revenue || 0)), 1);

  document.getElementById('mainContent').innerHTML = `
    <!-- KPIs -->
    <div>
      <div class="sec-title">Today's Performance</div>
      <div class="kpi-grid">
        <div class="kpi-card gold">
          <div class="kpi-icon">💰</div>
          <div class="kpi-val gold">${fmtSAR(todayRev)}</div>
          <div class="kpi-label">Revenue Today</div>
          <div class="kpi-sub">VAT: ${fmtSAR(Number(todayD.vat||0))}</div>
        </div>
        <div class="kpi-card green">
          <div class="kpi-icon">🛍️</div>
          <div class="kpi-val green">${fmtNum(todayOrders)}</div>
          <div class="kpi-label">Orders Today</div>
          <div class="kpi-sub">Avg: ${todayOrders > 0 ? fmtSAR(todayRev/todayOrders) : 'SAR 0'}</div>
        </div>
        <div class="kpi-card blue">
          <div class="kpi-icon">📦</div>
          <div class="kpi-val blue">${fmtNum(invD.variants || 0)}</div>
          <div class="kpi-label">SKUs in Stock</div>
          <div class="kpi-sub">${fmtSAR(invD.value || 0)} value</div>
        </div>
        <div class="kpi-card purple">
          <div class="kpi-icon">👥</div>
          <div class="kpi-val purple">${fmtNum(custD.total || 0)}</div>
          <div class="kpi-label">Total Customers</div>
          <div class="kpi-sub">+${fmtNum(custD.new_this_month || 0)} this month</div>
        </div>
      </div>
    </div>

    <!-- Month Revenue -->
    <div class="wide-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:11px;color:var(--muted);font-weight:700">MONTH TO DATE</div>
          <div style="font-size:24px;font-weight:900;color:var(--gold)">${fmtSAR(monthRev)}</div>
          <div style="font-size:11px;color:var(--muted)">${fmtNum(monthOrders)} orders · Disc: ${fmtSAR(monthD.discounts||0)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:28px;font-weight:900;color:var(--gold2)">${pct}%</div>
          <div style="font-size:10px;color:var(--muted)">of target</div>
        </div>
      </div>
      <div class="rev-bar-wrap">
        <div class="rev-bar-label"><span>0</span><span>Target: ${fmtSAR(monthTarget)}</span></div>
        <div class="rev-bar-bg"><div class="rev-bar-fill" style="width:${pct}%"></div></div>
      </div>
    </div>

    <!-- Alerts -->
    <div>
      <div class="sec-title">Alerts</div>
      <div class="alert-list">
        <div class="alert-item">
          <div class="alert-icon">⚠️</div>
          <div class="alert-text">
            <div class="alert-title">Low Stock Items</div>
            <div class="alert-sub">Below reorder point</div>
          </div>
          <div class="alert-badge ${Number(alerts.low_stock_variants||0) > 0 ? 'badge-red' : 'badge-blue'}">${fmtNum(alerts.low_stock_variants||0)} SKUs</div>
        </div>
        <div class="alert-item">
          <div class="alert-icon">🛒</div>
          <div class="alert-text">
            <div class="alert-title">Open Purchase Orders</div>
            <div class="alert-sub">Pending receipt</div>
          </div>
          <div class="alert-badge badge-amber">${fmtNum(alerts.open_purchase_orders||0)} POs</div>
        </div>
      </div>
    </div>

    <!-- Top Products -->
    <div>
      <div class="sec-title">Top Products Today</div>
      <div class="wide-card">
        ${salesProduct.length === 0 ? '<div class="empty">No sales data for today yet</div>' : `
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Product</th><th>Qty</th><th>Revenue</th></tr></thead>
            <tbody>
              ${salesProduct.slice(0,5).map((p,i) => `
                <tr>
                  <td class="rank">${i+1}</td>
                  <td style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${String(p.product||p.variant||'—').slice(0,22)}<br><span style="font-size:10px;color:var(--muted)">${p.sku||''}</span></td>
                  <td>${fmtNum(p.qty_sold)}</td>
                  <td class="sar">${fmtSAR(p.revenue)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`}
      </div>
    </div>

    <!-- Staff Performance -->
    <div>
      <div class="sec-title">Staff Performance Today</div>
      <div class="wide-card">
        ${salesStaff.length === 0 ? '<div class="empty">No staff data for today yet</div>' : `
        <div class="staff-grid">
          ${salesStaff.slice(0,5).map((s,i) => {
            const rev = Number(s.revenue||0);
            const barW = Math.round(rev/staffMax*100);
            const initials = String(s.staff||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
            return `
              <div class="staff-row">
                <div class="staff-avatar">${initials}</div>
                <div class="staff-info">
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <div class="staff-name">${String(s.staff||'Unknown').slice(0,18)}</div>
                    <div class="staff-rev">${fmtSAR(rev)}</div>
                  </div>
                  <div class="staff-orders">${fmtNum(s.orders)} orders · Avg ${fmtSAR(s.avg_order_value||0)}</div>
                  <div class="staff-bar-bg"><div class="staff-bar-fill" style="width:${barW}%"></div></div>
                </div>
              </div>`;
          }).join('')}
        </div>`}
      </div>
    </div>

    <div style="height:20px"></div>
  `;

  const now = new Date().toLocaleTimeString('en-SA');
  document.getElementById('lastUpdated').textContent = 'Last updated: ' + now;

  // Auto-refresh every 5 min
  setTimeout(loadAll, 5 * 60 * 1000);
}

// Init
document.getElementById('dateStr').textContent = todayDate();
loadConfig();
const savedUrl = localStorage.getItem(API_KEY);
const savedTok = localStorage.getItem(TOK_KEY);
if (savedUrl && savedTok) {
  document.getElementById('configBar').style.display = 'none';
  loadAll();
} else {
  // Show config bar
}

// Long press header to show config
let pressTimer;
document.querySelector('.logo').addEventListener('touchstart', () => {
  pressTimer = setTimeout(() => {
    const bar = document.getElementById('configBar');
    bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
  }, 1500);
});
document.querySelector('.logo').addEventListener('touchend', () => clearTimeout(pressTimer));
</script>
</body>
</html>
